name: Update Tsap Sui

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run Tsap Sui updater
        run: python update_tsapsui.py

      - name: Commit updated JSON
        run: |
          git config user.name "Tsap Sui Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tsapsui.json history.json
          git diff --cached --quiet || git commit -m "Update Tsap Sui"
          git push
